<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de usuarios | UPSJB</title>
<style>
:root{--navy:#142b4b;--pink:#ed145b;--bg:#f4f6fa;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1e293b}
header{background:var(--navy);color:white;padding:25px max(5%,calc((100% - 1150px)/2));border-bottom:5px solid var(--pink)}
header small{color:#f8a7c1;letter-spacing:1px}header h1{margin:8px 0 4px}
main{max-width:1150px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:330px 1fr;gap:22px}
.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:22px;box-shadow:0 5px 18px #142b4b0a}
h2{font-size:19px;margin:0 0 18px;color:var(--navy)}label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
button,.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--pink);color:white;font-weight:bold;cursor:pointer;text-decoration:none;font-size:13px;display:inline-block}
.secondary{background:var(--navy)}.danger{background:#dc2626}.light{background:#eaf0f8;color:var(--navy)}
.actions{display:flex;gap:7px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.alert{padding:11px;border-radius:8px;margin-bottom:12px;background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e2e8f0}th{color:var(--muted);font-size:12px;text-transform:uppercase}
.inline{display:inline}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:850px){main{grid-template-columns:1fr}table{font-size:12px}th,td{padding:9px 5px}}
</style></head>
<body>
<header><small>UNIVERSIDAD PRIVADA SAN JUAN BAUTISTA · INGENIERÍA DE SISTEMAS</small><h1 th:text="${titulo}">Gestión de usuarios</h1><div>CRUD con Spring Boot, Hibernate y Spring Data JPA</div></header>
<main>
<section class="card">
<h2 th:text="${usuario.id == null ? 'Registrar usuario' : 'Actualizar usuario'}">Registrar usuario</h2>
<div th:if="${exito}" class="alert" th:text="${exito}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<form th:object="${usuario}" th:action="${usuario.id == null ? '/usuarios/guardar' : '/usuarios/actualizar/' + usuario.id}" method="post">
<label>Nombre completo</label><input th:field="*{nombre}" placeholder="Ej. Pilar Tasayco" required>
<label>Correo electrónico</label><input type="email" th:field="*{email}" placeholder="nombre@correo.com" required>
<label>Edad</label><input type="number" min="0" th:field="*{edad}" placeholder="Ej. 22" required>
<div class="actions" style="margin-top:18px"><button type="submit" th:text="${usuario.id == null ? 'Guardar usuario' : 'Guardar cambios'}">Guardar</button><a class="btn light" href="/usuarios">Limpiar</a></div>
</form>
</section>
<section class="card">
<h2>Usuarios registrados</h2>
<div class="filters">
<form action="/usuarios" method="get" class="actions"><input style="width:210px" name="email" th:value="${filtroEmail}" placeholder="Buscar por email"><button>Buscar</button></form>
<a class="btn secondary" href="/usuarios">Ver todos</a><a class="btn light" href="/usuarios/mayores-18">Mayores de 18</a>
</div>
<div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Edad</th><th>Acciones</th></tr></thead>
<tbody><tr th:each="u : ${usuarios}"><td th:text="${u.id}"></td><td th:text="${u.nombre}"></td><td th:text="${u.email}"></td><td th:text="${u.edad}"></td><td><div class="actions"><a class="btn secondary" th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a><form class="inline" th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post" onsubmit="return confirm('¿Eliminar este usuario?')"><button class="danger">Eliminar</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="empty">No se encontraron usuarios.</td></tr></tbody></table></div>
</section>
</main></body></html>
